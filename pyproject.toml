[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "respot"
version = "0.0.1"
description = "Cross-platform scientific data analysis and graphing GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Respot" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "lmfit>=1.2",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyinstaller>=6.0"]
hdf5 = ["h5py>=3.8"]
mcp = ["fastmcp>=2.0"]

[project.scripts]
respot = "respot.__main__:main"
respot-mcp = "respot.mcp_server:main"

[project.gui-scripts]
respot-gui = "respot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/respot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
